<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF0004" />
    <title>Dieguito Ushuaia | Pizzas a la piedra, parrilla y comidas caseras</title>
    <meta
      name="description"
      content="Conocé el menú de Dieguito en Ushuaia. Pizzas a la piedra, empanadas, hamburguesas, parrilla, pastas y platos del mar."
    />
    <meta property="og:title" content="Dieguito Ushuaia | El sabor de Ushuaia" />
    <meta
      property="og:description"
      content="Pizzas a la piedra, parrilla y comidas caseras en Ushuaia. Conocé nuestro menú."
    />
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="es_AR" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <section
        style="
          max-width: 1280px;
          margin: 24px auto;
          padding: 36px;
          background: #171716;
          color: #fff6e9;
          border-radius: 24px;
          font-family: Arial, sans-serif;
          display: flex;
          flex-wrap: wrap;
          gap: 24px;
          align-items: center;
        "
      >
        <div style="flex: 1 1 280px">
          <p>DIEGUITO · USHUAIA</p>
          <h1 style="font-size: 42px">Pizzas a la piedra</h1>
          <p>
            Sabores irresistibles, ingredientes seleccionados y ese toque casero que nos
            caracteriza.
          </p>
          <a
            style="
              display: inline-block;
              background: #ff0004;
              color: white;
              padding: 16px;
              border-radius: 12px;
            "
            href="#menu-pizzas"
            >Ver pizzas</a
          >
        </div>
        <img
          src="/images/hero/pizza.png"
          alt="Pizza artesanal a la piedra"
          style="width: 100%; max-width: 620px; border-radius: 20px"
        />
      </section>
      <section
        id="menu-pizzas"
        style="max-width: 1280px; margin: auto; padding: 24px; font-family: Arial, sans-serif"
      >
        <h2>Pizzas</h2>
        <p>Muzzarella · Chica $12.000 · Grande $19.000</p>
        <noscript>Para buscar en la carta completa, activá JavaScript.</noscript>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
